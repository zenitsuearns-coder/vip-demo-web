<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Premium Service</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,700;1,600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        vip: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        neon: {
                            pink: '#ff1493',
                            red: '#ff003c',
                            velvet: '#3a0015',
                            dark: '#0a0004'
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2.5s infinite alternate',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { boxShadow: '0 0 15px #ff1493, inset 0 0 10px #ff003c' },
                            '100%': { boxShadow: '0 0 40px #ff1493, 0 0 20px #ff003c, inset 0 0 20px #ff1493' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0004;
            background-image: radial-gradient(circle at 50% -20%, #3a0015 0%, #0a0004 80%);
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
        }

        .glass-btn {
            background: rgba(255, 20, 147, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 20, 147, 0.15);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 20, 147, 0.15);
            border-color: #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
            transform: translateY(-2px);
        }

        /* Ensure hidden screens truly take up zero space */
        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen text-white font-sans selection:bg-neon-pink selection:text-white antialiased">

    <!-- ================= SCREEN 1: HOME ================= -->
    <div id="home-screen" class="min-h-screen flex flex-col items-center justify-center p-6 relative w-full max-w-xl mx-auto">
        <!-- Background Ambient Glow -->
        <div class="absolute top-10 -left-10 w-48 h-48 bg-neon-pink/20 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-10 -right-10 w-48 h-48 bg-neon-red/20 rounded-full blur-[100px] pointer-events-none"></div>

        <!-- Header -->
        <header class="text-center mb-12 relative z-10 animate-float">
            <h1 class="font-vip italic text-5xl md:text-6xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-neon-pink to-neon-red drop-shadow-[0_0_15px_rgba(255,20,147,0.5)]">
                VIP Demo Vault
            </h1>
            <p class="text-neon-pink/60 text-sm mt-4 uppercase tracking-[0.4em] font-light">Exclusive Previews</p>
        </header>

        <!-- Categories Container -->
        <div class="w-full flex flex-col gap-5 z-10">
            <!-- ================= 1. YAHAN PEHLE PACK KA NAAM AUR DETAILS DAALO ================= -->
            <!-- bracket ke andar apni video ka direct .mp4 link daalo -->
            <button onclick="playDemo('https://www.w3schools.com/html/mov_bbb.mp4')" class="glass-btn w-full p-6 rounded-2xl flex items-center justify-between group cursor-pointer">
                <div class="text-left">
                    <!-- Niche "Under 79rs" ki jagah apne pack ka naam likho -->
                    <h2 class="text-2xl font-bold font-vip tracking-wide text-white group-hover:text-neon-pink transition-colors">🔥 Under 79rs</h2>
                    <!-- Niche pack ki description change kar sakte ho -->
                    <p class="text-white/40 text-sm mt-1 font-light tracking-wide">A quick taste of our budget pleasures.</p>
                </div>
                <div class="text-2xl opacity-70 group-hover:opacity-100 group-hover:scale-110 transition-transform">💋</div>
            </button>

            <!-- ================= 2. YAHAN DUSRE PACK KA NAAM AUR DETAILS DAALO ================= -->
            <!-- bracket ke andar apni video ka direct .mp4 link daalo -->
            <button onclick="playDemo('https://www.w3schools.com/html/mov_bbb.mp4')" class="glass-btn w-full p-6 rounded-2xl flex items-center justify-between group cursor-pointer">
                <div class="text-left">
                    <h2 class="text-2xl font-bold font-vip tracking-wide text-white group-hover:text-neon-red transition-colors">💎 Premium Packs</h2>
                    <p class="text-white/40 text-sm mt-1 font-light tracking-wide">Exclusive, high-quality sessions.</p>
                </div>
                <div class="text-2xl opacity-70 group-hover:opacity-100 group-hover:scale-110 transition-transform">✨</div>
            </button>

            <!-- ================= 3. YAHAN TEESRE PACK KA NAAM AUR DETAILS DAALO ================= -->
            <!-- bracket ke andar apni video ka direct .mp4 link daalo -->
            <button onclick="playDemo('https://www.w3schools.com/html/mov_bbb.mp4')" class="glass-btn w-full p-6 rounded-2xl flex items-center justify-between group cursor-pointer">
                <div class="text-left">
                    <h2 class="text-2xl font-bold font-vip tracking-wide text-white group-hover:text-neon-pink transition-colors">📦 Mega Bundles</h2>
                    <p class="text-white/40 text-sm mt-1 font-light tracking-wide">The ultimate uncensored vault.</p>
                </div>
                <div class="text-2xl opacity-70 group-hover:opacity-100 group-hover:scale-110 transition-transform">🔥</div>
            </button>
        </div>
    </div>


    <!-- ================= SCREEN 2: VIDEO ================= -->
    <div id="video-screen" class="hidden-screen min-h-screen flex-col items-center justify-center p-4 relative w-full max-w-3xl mx-auto">
        <!-- Top Bar -->
        <div class="w-full flex items-center justify-start absolute top-6 left-6 z-20">
            <button onclick="showHome()" class="flex items-center gap-2 text-neon-pink/80 hover:text-white transition-colors bg-neon-velvet/50 backdrop-blur-md border border-neon-pink/30 px-5 py-2.5 rounded-full text-sm font-semibold tracking-wide shadow-[0_0_10px_rgba(255,20,147,0.2)]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Go Back
            </button>
        </div>

        <!-- Video Player -->
        <div class="w-full relative rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(255,20,147,0.3)] border border-neon-pink/40 bg-black aspect-video flex items-center justify-center">
            <video id="promo-video" class="w-full h-full object-cover" playsinline preload="auto"></video>
            
            <!-- Sleek gradient overlay at bottom -->
            <div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-black to-transparent pointer-events-none"></div>
        </div>
        
        <p class="mt-8 text-neon-pink/50 text-sm animate-pulse font-light tracking-[0.2em] uppercase">Enjoying the preview? Wait for it...</p>
    </div>


    <!-- ================= SCREEN 3: CTA ================= -->
    <div id="cta-screen" class="hidden-screen min-h-screen flex-col items-center justify-center p-6 relative w-full">
        <!-- Intense Background Glow for CTA -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,20,147,0.2)_0%,rgba(10,0,4,1)_70%)] pointer-events-none"></div>
        
        <h2 class="font-vip text-3xl text-white/80 italic mb-10 z-10 text-center">Your exclusive session awaits...</h2>

        <!-- Massive Glowing Buy Button -->
        <!-- ================= YAHAN TUMHARA TELEGRAM BOT LINK PEHLE SE SET HAI ================= -->
        <a href="https://telegram.me/riyatg1bot" target="_blank" class="z-10 relative px-10 py-6 rounded-2xl font-bold text-xl md:text-2xl text-center tracking-widest text-white bg-gradient-to-r from-neon-red to-neon-pink animate-pulse-glow border border-white/30 transform transition-transform hover:scale-105 overflow-hidden group">
            <!-- Glass Shine Effect -->
            <div class="absolute top-0 -left-[100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/40 to-transparent skew-x-[-20deg] group-hover:animate-[shine_1s_ease-in-out]"></div>
            
            <span class="relative z-10 flex items-center justify-center gap-3">
                <span class="text-3xl">💋</span> 
                UNLOCK VIP ON TELEGRAM
            </span>
        </a>
        
        <button onclick="showHome()" class="mt-12 text-white/40 hover:text-white text-sm tracking-widest underline z-10 transition-colors">
            Return to Demos
        </button>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // Screen Elements
        const homeScreen = document.getElementById('home-screen');
        const videoScreen = document.getElementById('video-screen');
        const ctaScreen = document.getElementById('cta-screen');
        const videoElement = document.getElementById('promo-video');

        // Helper function to show only one screen at a time
        function toggleScreens(showId) {
            // Hide all
            homeScreen.classList.add('hidden-screen');
            homeScreen.classList.remove('flex');
            
            videoScreen.classList.add('hidden-screen');
            videoScreen.classList.remove('flex');
            
            ctaScreen.classList.add('hidden-screen');
            ctaScreen.classList.remove('flex');

            // Show target
            const target = document.getElementById(showId);
            target.classList.remove('hidden-screen');
            target.classList.add('flex');
        }

        // Action: User clicks a category
        function playDemo(videoUrl) {
            toggleScreens('video-screen');
            videoElement.src = videoUrl;
            videoElement.play().catch(e => {
                // If browser blocks autoplay, mute it and try again
                console.log("Autoplay blocked. Attempting muted playback.");
                videoElement.muted = true;
                videoElement.play();
            });
        }

        // Action: User clicks Go Back
        function showHome() {
            videoElement.pause();
            videoElement.currentTime = 0;
            videoElement.src = "";
            toggleScreens('home-screen');
        }

        // Action: Video finishes playing automatically
        videoElement.addEventListener('ended', () => {
            toggleScreens('cta-screen');
        });
    </script>
</body>
</html>
